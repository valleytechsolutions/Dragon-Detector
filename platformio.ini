[platformio]
default_envs = waveshare
src_dir = firmware/src
include_dir = firmware/include
data_dir = firmware/data

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/path_sanitize.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = hardware/spotpear/partitions.csv
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = hardware/spotpear/lib
lib_ignore = ESP8266Audio
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Ifirmware/include
    -DCORE_DEBUG_LEVEL=1

[env:spotpear]
build_src_filter = +<*> -<board_amoled175c.cpp> -<board_stopwatch.cpp>

[env:waveshare]
build_src_filter = +<*> -<display.cpp> -<board_stopwatch.cpp>
build_flags = ${env.build_flags} -DBOARD_AMOLED_175C
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander
lib_deps =
    lewisxhe/SensorLib@0.3.1
    lewisxhe/XPowersLib@0.2.6

[env:stopwatch]
build_src_filter = +<*> -<display.cpp> -<board_amoled175c.cpp>
build_flags = ${env.build_flags} -DBOARD_STOPWATCH
board_build.partitions = hardware/m5stack-stopwatch/partitions.csv
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander
lib_deps =
    https://github.com/m5stack/M5Unified.git#e79eb6e3137a41e50b0ec23c8c38738bdb3a11e2
    https://github.com/m5stack/M5GFX.git#641944bd5b123e42b6f4379ff16768e292e203d1
