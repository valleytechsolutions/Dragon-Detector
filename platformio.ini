[platformio]
default_envs = waveshare
src_dir = firmware/src
include_dir = firmware/include
data_dir = firmware/data

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/path_sanitize.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = hardware/spotpear/partitions.csv
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = hardware/spotpear/lib
lib_ignore = ESP8266Audio
; Normal boots keep hardware USB serial/JTAG; BadUSB restarts into a one-shot
; TinyUSB keyboard mode on request (firmware/src/badusb_mode.cpp).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDRAGON_BADUSB=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Ifirmware/include
    -DCORE_DEBUG_LEVEL=1

[env:spotpear]
build_flags = ${env.build_flags} -DDRAGON_WIFI_CLOCK -Wl,-zmuldefs
build_src_filter = +<*> -<board_amoled175c.cpp> -<board_stopwatch.cpp> -<board_xiao_round.cpp> -<board_waveshare_lite.cpp> -<ui_lite.cpp> -<lite_support.cpp>

[env:guition_185_beta]
extends = env:spotpear
build_flags = ${env:spotpear.build_flags} -DBOARD_GUITION_185_BETA

[env:waveshare]
board_upload.flash_size = 32MB
board_build.partitions = hardware/waveshare-amoled/partitions.csv
build_src_filter = +<*> -<display.cpp> -<board_stopwatch.cpp> -<board_xiao_round.cpp> -<board_waveshare_lite.cpp> -<ui_lite.cpp> -<lite_support.cpp>
build_flags = ${env.build_flags} -DBOARD_AMOLED_175C -DDRAGON_WIFI_CLOCK -Wl,-zmuldefs
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander
lib_deps =
    lewisxhe/SensorLib@0.3.1
    lewisxhe/XPowersLib@0.2.6

[env:waveshare_206]
extends = env:waveshare
board_build.partitions = hardware/waveshare-amoled-206/partitions.csv
build_flags = ${env.build_flags} -DBOARD_WAVESHARE_206 -DDRAGON_WIFI_CLOCK -Wl,-zmuldefs


[env:stopwatch]
build_src_filter = +<*> -<display.cpp> -<board_amoled175c.cpp> -<board_xiao_round.cpp> -<board_waveshare_lite.cpp> -<ui_lite.cpp> -<lite_support.cpp>
build_flags = ${env.build_flags} -DBOARD_STOPWATCH -DDRAGON_WIFI_CLOCK -Wl,-zmuldefs
board_build.partitions = hardware/m5stack-stopwatch/partitions.csv
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander
lib_deps =
    https://github.com/m5stack/M5Unified.git#e79eb6e3137a41e50b0ec23c8c38738bdb3a11e2
    https://github.com/m5stack/M5GFX.git#641944bd5b123e42b6f4379ff16768e292e203d1

[env:elecrow_21]
framework = arduino, espidf
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.elecrow_21
board_build.partitions = hardware/elecrow-rotary-21/partitions.csv
extra_scripts =
    ${env.extra_scripts}
    pre:tools/elecrow_link_check.py
; Arduino_GFX 1.5.6 uses the IDF 5.3 name for IDF 5.1's SPI interrupt selector.
build_flags = ${env.build_flags} -DBOARD_CROWPANEL_21 -DDRAGON_WIFI_CLOCK -DESP_INTR_CPU_AFFINITY_AUTO=INTR_CPU_ID_AUTO
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#58ac1d46438b9406f87a53ae87ca9f377ca805fb

[env:waveshare_175]
board_upload.flash_size = 16MB
board_build.partitions = hardware/waveshare-amoled-175/partitions.csv
build_src_filter = ${env:waveshare.build_src_filter}
build_flags = ${env.build_flags} -DBOARD_AMOLED_175 -DDRAGON_WIFI_CLOCK -Wl,-zmuldefs
lib_ignore = ${env:waveshare.lib_ignore}
lib_deps = ${env:waveshare.lib_deps}

[env:waveshare_175_gps]
extends = env:waveshare_175
build_flags = ${env:waveshare_175.build_flags} -DBOARD_GPS_LC76G

[env:waveshare_185b]
board_upload.flash_size = 16MB
board_build.partitions = hardware/waveshare-lcd-185b/partitions.csv
build_src_filter = ${env:waveshare.build_src_filter} -<board_amoled175c.cpp>
build_flags = ${env.build_flags} -DBOARD_WAVESHARE_185B -DDRAGON_WIFI_CLOCK -Wl,-zmuldefs
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander

[env:waveshare_143c]
; ESP32-S3-PICO-1: 8 MB flash and 8 MB octal PSRAM. Not the 16 MB non-C 1.43.
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = hardware/waveshare-amoled-143c/partitions.csv
build_src_filter = +<*> -<display.cpp> -<board_amoled175c.cpp> -<board_stopwatch.cpp> -<board_xiao_round.cpp> -<board_waveshare_lite.cpp> -<board_lilygo_175.cpp> -<board_waveshare_185b.cpp> -<board_m5dial.cpp> -<board_crowpanel_21.cpp> -<board_watcher.cpp> -<ui_lite.cpp> -<lite_support.cpp>
build_flags = ${env.build_flags} -DBOARD_WAVESHARE_143C -DDRAGON_WIFI_CLOCK -Wl,-zmuldefs
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander

[env:xiao_round]
board = seeed_xiao_esp32s3
board_upload.flash_size = 8MB
board_build.partitions = hardware/xiao-round/partitions.csv
build_src_filter = +<*> -<display.cpp> -<board_amoled175c.cpp> -<board_stopwatch.cpp> -<board_waveshare_lite.cpp> -<ui_lite.cpp> -<lite_support.cpp>
build_flags =
    ${env.build_flags}
    -Wl,-zmuldefs
    -DBOARD_XIAO_ROUND
    -DDRAGON_WIFI_CLOCK
    -DUSER_SETUP_LOADED
    -DGC9A01_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=0
    -DTFT_SCLK=7
    -DTFT_MISO=8
    -DTFT_MOSI=9
    -DTFT_CS=2
    -DTFT_DC=4
    -DTFT_RST=-1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299

[env:waveshare_lite]
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.partitions = hardware/waveshare-lite/partitions.csv
build_src_filter = +<*> -<display.cpp> -<board_amoled175c.cpp> -<board_stopwatch.cpp> -<board_xiao_round.cpp> -<ui.cpp> -<audio.cpp> -<tone_output.cpp> -<badge.cpp> -<wearable.cpp> -<logo.cpp>
; This USB-C port is a CH343 UART bridge, not the S3's native USB pins.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1 -DDRAGON_BADUSB=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_RADAR_LITE
    -DUSE_HSPI_PORT
    -DUSER_SETUP_LOADED
    -DGC9A01_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=0
    -DTFT_SCLK=10
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_CS=9
    -DTFT_DC=8
    -DTFT_RST=12
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299

[env:lilygo_175]
board_upload.flash_size = 16MB
board_build.partitions = hardware/lilygo-amoled-175/partitions.csv
build_src_filter = ${env:waveshare.build_src_filter} -<board_amoled175c.cpp>
build_flags = ${env.build_flags} -DBOARD_LILYGO_175 -DDRAGON_WIFI_CLOCK -Wl,-zmuldefs
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander
lib_deps = lewisxhe/SensorLib@0.3.1

[env:m5dial]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_build.partitions = hardware/m5stack-dial/partitions.csv
build_src_filter = ${env:waveshare_lite.build_src_filter} -<board_waveshare_lite.cpp>
build_unflags = -DBOARD_HAS_PSRAM
build_flags =
    ${env.build_flags}
    -DBOARD_M5DIAL
    -DBOARD_RADAR_LITE
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; FSPI maps MISO=-1 onto MOSI in TFT_eSPI; Arduino 3 detaches that shared pin.
    -DUSE_HSPI_PORT
    -DUSER_SETUP_LOADED
    -DGC9A01_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=0
    -DTFT_SCLK=6
    -DTFT_MISO=-1
    -DTFT_MOSI=5
    -DTFT_CS=7
    -DTFT_DC=4
    -DTFT_RST=8
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
lib_ignore = ${env:waveshare_lite.lib_ignore}
lib_deps = ${env:waveshare_lite.lib_deps}

[env:watcher]
board_upload.flash_size = 32MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = hardware/seeed-watcher/partitions.csv
build_src_filter = ${env:waveshare.build_src_filter} -<board_amoled175c.cpp>
; CH342 bridges both processors. GPIO19/20 remain available for expansion/GPS.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1 -DDRAGON_BADUSB=1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0 -DBOARD_WATCHER -DDRAGON_WIFI_CLOCK -DCONFIG_ESP_LCD_TOUCH_MAX_POINTS=5 -DCONFIG_ESP_LCD_TOUCH_MAX_BUTTONS=0 -Wl,-zmuldefs
lib_extra_dirs = ${env.lib_extra_dirs}, hardware/seeed-watcher/lib
lib_ignore = ESP8266Audio, ESP32_Display_Panel, ESP32_IO_Expander

[env:waveshare_p4_knob]
; Waveshare ESP32-P4-Knob-Touch-AMOLED-1.75: ESP32-P4 v3.x, 32 MB flash, 32 MB
; PSRAM, MIPI-DSI CO5300, CST9217, knob, ES8389 and a classic ESP32 radio chip on
; SDIO. Arduino 3.3.12 as an ESP-IDF 5.5.5 component (the radio chip type and
; BLE host are compile-time IDF choices). Build it with its own
; PLATFORMIO_CORE_DIR: the 3.3.12 platform replaces 3.0.7's framework packages.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-p4_r3
framework = arduino, espidf
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_psram = 200000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = hardware/waveshare-p4-knob-175/partitions.csv
board_build.esp-idf.sdkconfig_path = ${platformio.workspace_dir}/sdkconfig.waveshare_p4_knob
extra_scripts =
    ${env.extra_scripts}
    post:tools/p4_image_revisions.py
board_build.cmake_extra_args = -DDRAGON_BOARD=waveshare_p4_knob
; Unflag only the USB mode: an unflag also strips the same flag from build_flags.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Ifirmware/include
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_WAVESHARE_P4_KNOB
    -DDRAGON_WIFI_CLOCK
lib_ignore = ESP8266Audio, NimBLE-Arduino, ESP32_Display_Panel, ESP32_IO_Expander, esp_lcd_co5300, es8311
lib_deps =
    lewisxhe/SensorLib@0.3.1
    lewisxhe/XPowersLib@0.2.6
