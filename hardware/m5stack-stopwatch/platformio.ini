[env:stopwatch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/path_sanitize.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_ignore = ESP8266Audio
lib_deps =
    https://github.com/m5stack/M5Unified.git#e79eb6e3137a41e50b0ec23c8c38738bdb3a11e2
    https://github.com/m5stack/M5GFX.git#641944bd5b123e42b6f4379ff16768e292e203d1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
