name: Firmware and web checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts='--all --full-history' --redact=100 --no-banner
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js
      - run: python tools/test_flash_budget.py
      - run: python tools/test_amoled175.py --cxx g++
      - run: python tools/test_rtc.py --cxx g++
      - run: python tools/test_m5dial.py --cxx g++
      - run: python tools/test_lilygo175.py --cxx g++
      - run: python tools/test_sd_records.py --cxx g++
      - run: python tools/test_gps_transport.py --cxx g++
      - run: python tools/test_core.py --cxx g++
      - run: python tools/test_core.py --cxx g++ --sanitize
      - run: python tools/test_theme_assets.py --cxx g++
  build:
    needs: [test, secrets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [m5dial, lilygo_175, spotpear, waveshare, stopwatch, xiao_round, waveshare_lite, waveshare_175, waveshare_175_gps, elecrow_21]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0 esptool==5.4.0
      - run: python tools/build_release.py --board ${{ matrix.board }}
      - run: node tools/check_web_manifests.mjs ${{ matrix.board }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragon-detector-${{ matrix.board }}
          path: web/firmware/${{ matrix.board }}
          if-no-files-found: error
