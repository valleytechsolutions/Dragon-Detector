name: Firmware and web checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts='--all --full-history' --redact=100 --no-banner
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js
      - run: python tools/test_flash_budget.py
      - run: python tools/test_amoled175.py --cxx g++
      - run: python tools/test_amoled175c_controls.py --cxx g++
      - run: python tools/test_rtc.py --cxx g++
      - run: python tools/test_m5dial.py --cxx g++
      - run: python tools/test_lilygo175.py --cxx g++
      - run: python tools/test_waveshare185b.py --cxx g++
      - run: python tools/test_waveshare185b_ui.py --cxx g++
      - run: python tools/test_waveshare143c.py --cxx g++
      - run: python tools/test_sd_records.py --cxx g++
      - run: python tools/test_sd_labels.py --cxx g++
      - run: python tools/test_sd_labels.py --cxx g++ --sanitize
      - run: python tools/test_sd_maintenance.py --cxx g++
      - run: python tools/test_gps_transport.py --cxx g++
      - run: python tools/test_wardrive_radio.py --cxx g++
      - run: python tools/test_gps_uart.py --cxx g++
      - run: python tools/test_optional_gps_ui.py --cxx g++
      - run: python tools/test_wardrive_session.py --cxx g++
      - run: python tools/test_sd_ui_gates.py --cxx g++
      - run: python tools/test_core.py --cxx g++
      - run: python tools/test_core.py --cxx g++ --sanitize
      - run: python tools/test_badusb.py --cxx g++
      - run: python tools/test_badusb.py --cxx g++ --sanitize
      - run: python tools/test_nearby.py
      - run: python tools/test_alert_policy.py
      - run: python tools/test_theme_assets.py --cxx g++
      - run: python tools/test_theme_retirement.py --cxx g++
      - run: python tools/test_vlad_art.py
      - run: python tools/test_audio_levels.py --cxx g++
  build:
    needs: [test, secrets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [waveshare_143c, waveshare_185b, watcher, m5dial, lilygo_175, spotpear, waveshare, stopwatch, xiao_round, waveshare_lite, waveshare_175, waveshare_175_gps, elecrow_21]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0 esptool==5.4.0
      - name: Repair relocated ESP-IDF Python cache
        if: matrix.board == 'elecrow_21'
        run: |
          python - <<'PY'
          from pathlib import Path
          # Restored virtualenvs can point at a Python installation that is no
          # longer on this runner. Invalidate only their completion marker;
          # PlatformIO then recreates its own environment before compiling.
          for environment in (Path.home() / '.platformio' / 'penv').glob('.espidf-*'):
              marker = environment / 'pio-idf-venv.json'
              if environment.is_symlink():
                  raise RuntimeError('Unexpected symlink for cached ESP-IDF environment')
              if marker.is_file() and not (environment / 'bin' / 'python').is_file():
                  marker.unlink()
                  print('Rebuilding unavailable cached ESP-IDF Python:', environment.name)
          PY
      - run: python tools/build_release.py --board ${{ matrix.board }}
      - run: node tools/check_web_manifests.mjs ${{ matrix.board }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragon-detector-${{ matrix.board }}
          path: web/firmware/${{ matrix.board }}
          if-no-files-found: error
  # Publishes a GitHub release for each new DRAGON_VERSION that reaches main.
  # Runs only after every board built and passed; an existing release is never
  # replaced, so re-runs and later commits on the same version do nothing.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^#define DRAGON_VERSION "\([0-9.]*\)"$/\1/p' firmware/include/dragon_version.h)
          test -n "$version" || { echo "::error::DRAGON_VERSION not found"; exit 1; }
          test -f "docs/RELEASE-$version.md" || { echo "::error::docs/RELEASE-$version.md is missing"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        if: steps.version.outputs.exists == 'false'
        with:
          pattern: dragon-detector-*
          path: dist
      - name: Check packages and collect release files
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          version = os.environ['VERSION']
          dist, out = pathlib.Path('dist'), pathlib.Path('release')
          out.mkdir()
          folders = sorted(p for p in dist.iterdir() if p.is_dir())
          assert len(folders) == 13, f'expected 13 board packages, found {len(folders)}'
          sums = []
          for folder in folders:
              board = folder.name.removeprefix('dragon-detector-')
              info = json.loads((folder / 'build-info.json').read_text())
              assert info.get('version') == version, f'{board}: package version {info.get("version")}, expected {version}'
              zips = list(folder.glob('*.zip'))
              assert len(zips) == 1, f'{board}: expected one ZIP, found {len(zips)}'
              target = out / f'dragon-detector-{board}-{version}.zip'
              shutil.copyfile(zips[0], target)
              sums.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {target.name}')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          print('\n'.join(sums))
          PY
      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "Dragon Detector $VERSION" \
            --notes-file "docs/RELEASE-$VERSION.md"
