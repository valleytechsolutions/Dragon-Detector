name: Forward visitors to web flasher
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - hosting/github-pages/**
      - tests/github-pages-redirect.test.js
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check forwarding destinations
        run: node --test tests/github-pages-redirect.test.js
      - name: Package forwarding page
        run: |
          mkdir -p .build/github-pages
          cp hosting/github-pages/index.html .build/github-pages/index.html
          cp hosting/github-pages/index.html .build/github-pages/404.html
          touch .build/github-pages/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .build/github-pages
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
