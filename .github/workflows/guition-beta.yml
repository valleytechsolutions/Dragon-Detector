name: Guition display beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guition-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-guition_185_beta-${{ hashFiles('platformio.ini') }}
      - run: python tools/test_guition_beta.py --cxx g++
      - run: node --test tests/*.test.js
      - run: pip install platformio==6.2.0 esptool==5.4.0
      - run: python tools/build_release.py --board guition_185_beta
      - run: node tools/check_web_manifests.mjs guition_185_beta
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragon-detector-guition_185_beta
          path: web/firmware/guition_185_beta
          if-no-files-found: error
