<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open the Dragon Detector Web Flasher</title>
  <link rel="canonical" href="https://valleytechsolutions.github.io/Dragon-Detector-Flasher/">
  <noscript><meta http-equiv="refresh" content="0;url=https://valleytechsolutions.github.io/Dragon-Detector-Flasher/"></noscript>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1413; color: #eff9f4; }
    main { max-width: 34rem; padding: 2rem; }
    p { line-height: 1.6; }
    a { color: #81e6b0; }
    .button { display: inline-block; padding: 1rem 1.4rem; border-radius: .6rem; background: #167c4b; color: white; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Dragon Detector</h1>
    <p>Opening the official release flasher. Choose your hardware, install firmware and set the clock.</p>
    <p><a class="button" id="flasher" href="https://valleytechsolutions.github.io/Dragon-Detector-Flasher/">Open Web Flasher →</a></p>
    <p>Use desktop Chrome or Edge with a USB data cable.</p>
    <p><a href="https://valleytech-dragon-detector.pages.dev/#studio">Badge Studio</a> · <a href="https://valleytech-dragon-detector.pages.dev/#theme-studio">Theme Creator</a> · <a href="https://valleytech-dragon-detector.pages.dev/#install">P4 and separate beta installers</a></p>
    <p><a href="https://github.com/valleytechsolutions/Dragon-Detector">Source code and documentation</a></p>
  </main>
  <script>
    const prefix = '/Dragon-Detector';
    const path = location.pathname;
    const root = path === prefix || path === prefix + '/' || path === prefix + '/index.html';
    const params = new URLSearchParams(location.search);
    const separate = ['waveshare_p4_knob', 'guition_185_beta', 't5-e1'].includes(params.get('board'));
    const install = ['', '#install', '#clock-sync-panel'].includes(location.hash);
    const release = root && install && !separate;
    const destination = new URL(release
      ? 'https://valleytechsolutions.github.io/Dragon-Detector-Flasher/'
      : 'https://valleytech-dragon-detector.pages.dev/');
    if (!root && path.startsWith(prefix + '/')) {
      destination.pathname = path.slice(prefix.length);
    }
    destination.search = location.search;
    destination.hash = release ? '' : location.hash || (root ? '#install' : '');
    document.getElementById('flasher').href = destination.href;
    location.replace(destination.href);
  </script>
</body>
</html>
