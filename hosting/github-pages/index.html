<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open the Dragon Detector Web Flasher</title>
  <link rel="canonical" href="https://valleytech-dragon-detector.pages.dev/">
  <noscript><meta http-equiv="refresh" content="0;url=https://valleytech-dragon-detector.pages.dev/#install"></noscript>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1413; color: #eff9f4; }
    main { max-width: 34rem; padding: 2rem; }
    p { line-height: 1.6; }
    a { color: #81e6b0; }
    .button { display: inline-block; padding: 1rem 1.4rem; border-radius: .6rem; background: #167c4b; color: white; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Dragon Detector</h1>
    <p>Opening the web flasher. Install firmware, choose your hardware and access device tools.</p>
    <p><a class="button" id="flasher" href="https://valleytech-dragon-detector.pages.dev/#install">Open Web Flasher →</a></p>
    <p>Use desktop Chrome or Edge with a USB data cable.</p>
    <p><a href="https://github.com/valleytechsolutions/Dragon-Detector">Source code and documentation</a></p>
  </main>
  <script>
    const destination = new URL('https://valleytech-dragon-detector.pages.dev/');
    const prefix = '/Dragon-Detector';
    const path = location.pathname;
    if (path.startsWith(prefix + '/') && path !== prefix + '/index.html') {
      destination.pathname = path.slice(prefix.length);
    }
    destination.search = location.search;
    destination.hash = location.hash || (destination.pathname === '/' ? '#install' : '');
    document.getElementById('flasher').href = destination.href;
    location.replace(destination.href);
  </script>
</body>
</html>
